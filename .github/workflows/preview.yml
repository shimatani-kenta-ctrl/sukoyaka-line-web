# 確認用の組み立て（本番には公開しません）
# preview/ で始まるブランチに変更が入ると、サイトを組み立てて「site」という名前で保存します。
name: 確認用に組み立て

on:
  push:
    branches: ["preview/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7
